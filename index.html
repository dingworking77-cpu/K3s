<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบสแกนพัสดุ - iData K3S</title>
  <!-- โหลด Tailwind CSS สำหรับตกแต่งหน้าเว็บให้สวยงามและรองรับจอ 4 นิ้วของ K3S -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- โหลด Tone.js สำหรับสร้างเสียงแจ้งเตือน (ติ๊ดเวลาสแกน, เสียงเตือนเมื่อสแกนซ้ำ) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- โหลดฟอนต์ Inter และ Noto Sans Thai -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans Thai', sans-serif;
      overscroll-behavior-y: contain; /* ป้องกันการดึงหน้าจอเพื่อรีเฟรชโดยไม่ตั้งใจ */
    }
    /* ซ่อน Scrollbar แต่ยังเลื่อนดูรายการได้ */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-[100dvh] w-full flex flex-col overflow-hidden select-none">

  <!-- ส่วนหัว (Header) ขยายใหญ่พิเศษ 4 เท่า -->
  <header class="bg-blue-700 text-white px-5 py-4 shadow-md flex items-center justify-between shrink-0">
    <div class="flex items-center space-x-4 min-w-0">
      <svg class="w-16 h-16 text-blue-200 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
      </svg>
      <div class="truncate">
        <h1 class="font-bold text-3xl leading-tight">สแกนพัสดุ K3S</h1>
        <p class="text-xl text-blue-200 leading-tight truncate mt-1" id="statusText">พร้อมยิงบาร์โค้ด</p>
      </div>
    </div>
    
    <!-- ตัวเลขสรุปจำนวนพัสดุในคิว -->
    <div class="bg-blue-800 border-4 border-blue-400 rounded-2xl px-5 py-2.5 flex items-center space-x-3 shrink-0">
      <span class="text-2xl font-bold text-blue-200">รวม</span>
      <span id="itemCount" class="text-5xl font-extrabold text-white leading-none">0</span>
    </div>
  </header>

  <!-- กล่องแจ้งเตือนแบบนุ่มนวล -->
  <div id="toastBanner" class="hidden px-5 py-3.5 text-2xl font-bold text-center transition-all duration-200 shrink-0"></div>

  <!-- ช่องรับค่าจากการยิงบาร์โค้ด (ขยายช่องกรอกและตัวอักษรใหญ่เต็มตา) -->
  <section class="p-4 bg-white border-b-2 border-slate-200 shadow-sm shrink-0">
    <div class="relative flex items-center">
      <input 
        type="text" 
        id="barcodeInput" 
        placeholder="กดปุ่มยิงบาร์โค้ด..." 
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        class="w-full px-5 py-5 text-3xl font-bold bg-slate-50 border-4 border-blue-500 rounded-2xl focus:outline-none focus:ring-4 focus:ring-blue-300 focus:bg-white text-slate-900 placeholder-slate-400"
      >
    </div>

    <!-- ตัวเลือกเสริม: ป้องกันสแกนซ้ำ & เปิด/ปิดเสียง (ขยายเช็กบ็อกซ์ ตัวอักษร และปุ่มโฟกัสใหญ่ 4 เท่า) -->
    <div class="flex items-center justify-between mt-4 px-1 text-2xl text-slate-700 gap-2">
      <label class="flex items-center space-x-3 py-2 cursor-pointer">
        <input type="checkbox" id="preventDuplicate" checked class="w-9 h-9 text-blue-600 rounded-lg focus:ring-blue-500">
        <span class="font-bold">กันซ้ำ</span>
      </label>

      <label class="flex items-center space-x-3 py-2 cursor-pointer">
        <input type="checkbox" id="enableSound" checked class="w-9 h-9 text-blue-600 rounded-lg focus:ring-blue-500">
        <span class="font-bold">เสียง</span>
      </label>

      <button type="button" id="refocusBtn" class="bg-blue-100 hover:bg-blue-200 active:bg-blue-300 text-blue-800 font-bold px-5 py-3.5 rounded-2xl border-2 border-blue-400 text-2xl shadow-sm">
        โฟกัสช่องยิง
      </button>
    </div>
  </section>

  <!-- พื้นที่แสดงรายการเลขพัสดุที่สแกนแล้ว -->
  <main class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar" id="listContainer">
    <!-- ข้อความตอนยังไม่มีรายการ -->
    <div id="emptyState" class="h-full flex flex-col items-center justify-center text-slate-400 text-center px-4">
      <svg class="w-24 h-24 mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
      </svg>
      <p class="text-3xl font-bold text-slate-500">ยังไม่มีรายการพัสดุ</p>
      <p class="text-2xl mt-2">กดปุ่มสแกนด้านข้างเครื่องเพื่อยิง</p>
    </div>

    <!-- รายการบาร์โค้ดจะถูกแทรกที่นี่ด้วย JavaScript -->
    <ul id="scannedList" class="space-y-3 hidden"></ul>
  </main>

  <!-- แถบปุ่มควบคุมด้านล่าง (ปุ่มใหญ่พิเศษ 4 เท่า) -->
  <footer class="bg-white border-t-2 border-slate-200 p-4 grid grid-cols-3 gap-3 shrink-0">
    <button 
      type="button" 
      id="clearBtn"
      class="col-span-1 bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-800 font-bold py-6 px-3 rounded-2xl text-3xl transition flex items-center justify-center shadow-sm">
      ล้างค่า
    </button>

    <button 
      type="button" 
      id="saveBtn"
      class="col-span-2 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-6 px-4 rounded-2xl text-3xl shadow-md transition flex items-center justify-center space-x-3">
      <svg class="w-10 h-10 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
      </svg>
      <span id="saveBtnText">บันทึก (0)</span>
    </button>
  </footer>

  <!-- Modal ยืนยันการล้างข้อมูล -->
  <div id="confirmModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-5 z-50">
    <div class="bg-white rounded-3xl w-full max-w-md p-7 shadow-2xl text-center">
      <h3 class="text-3xl font-bold text-slate-800">ยืนยันการล้างรายการ?</h3>
      <p class="text-2xl text-slate-500 mt-3">รายการที่สแกนค้างไว้จะถูกลบ</p>
      <div class="grid grid-cols-2 gap-4 mt-7">
        <button id="cancelClearBtn" class="py-5 rounded-2xl bg-slate-200 text-slate-800 font-bold text-2xl">ยกเลิก</button>
        <button id="confirmClearBtn" class="py-5 rounded-2xl bg-rose-600 text-white font-bold text-2xl">ลบทิ้งเลย</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. ตั้งค่า URL ของ Google Apps Script Web App
    // =========================================================================
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzzlww8AXROufhrEu9d4zLjA_a98Bx5_SWFtKpU1R96Shh3H_xsaO4nYl7-ADHccXgJ/exec';

    // ตัวแปรเก็บรายการเลขพัสดุที่สแกนได้ (รูปแบบ: { code: 'TH123...', time: '14:30:05' })
    let scannedItems = [];
    let isSaving = false;

    // อ้างอิง Element ต่างๆ บนหน้าจอ
    const barcodeInput = document.getElementById('barcodeInput');
    const scannedList = document.getElementById('scannedList');
    const emptyState = document.getElementById('emptyState');
    const itemCount = document.getElementById('itemCount');
    const saveBtn = document.getElementById('saveBtn');
    const saveBtnText = document.getElementById('saveBtnText');
    const clearBtn = document.getElementById('clearBtn');
    const preventDuplicate = document.getElementById('preventDuplicate');
    const enableSound = document.getElementById('enableSound');
    const toastBanner = document.getElementById('toastBanner');
    const statusText = document.getElementById('statusText');
    const refocusBtn = document.getElementById('refocusBtn');
    const confirmModal = document.getElementById('confirmModal');
    const cancelClearBtn = document.getElementById('cancelClearBtn');
    const confirmClearBtn = document.getElementById('confirmClearBtn');

    // =========================================================================
    // 2. ระบบเสียงแจ้งเตือนด้วย Tone.js (ไม่ต้องใช้ไฟล์เสียงภายนอก)
    // =========================================================================
    let synth = null;
    function playBeep(type) {
      if (!enableSound.checked) return;
      try {
        if (!synth) {
          synth = new Tone.Synth().toDestination();
        }
        if (Tone.context.state !== 'running') {
          Tone.start();
        }
        if (type === 'success') {
          // เสียงติ๊ดสั้นๆ โทนสูงเมื่อสแกนเข้า
          synth.triggerAttackRelease('C6', '0.08');
        } else if (type === 'duplicate') {
          // เสียงเตือนโทนต่ำเมื่อสแกนซ้ำ
          synth.triggerAttackRelease('A3', '0.2');
        } else if (type === 'saved') {
          // เสียงโน้ตคู่เมื่อบันทึกขึ้น Google Sheets สำเร็จ
          const now = Tone.now();
          synth.triggerAttackRelease('E5', '0.1', now);
          synth.triggerAttackRelease('G5', '0.15', now + 0.12);
        }
      } catch (e) {
        console.warn('Audio playback skipped:', e);
      }
    }

    // =========================================================================
    // 3. ฟังก์ชันจัดการการสแกนและการเพิ่มรายการ
    // =========================================================================
    function handleBarcodeSubmit(rawValue) {
      const code = String(rawValue || '').trim();
      if (!code) return;

      // ตรวจสอบเลขซ้ำหากเปิดใช้งานตัวเลือก "ป้องกันเลขซ้ำ"
      if (preventDuplicate.checked) {
        const isExist = scannedItems.some(item => item.code.toLowerCase() === code.toLowerCase());
        if (isExist) {
          playBeep('duplicate');
          showToast(`⚠️ เลขซ้ำ: ${code}`, 'bg-amber-500 text-white');
          barcodeInput.value = '';
          keepFocus();
          return;
        }
      }

      // บันทึกเวลาปัจจุบันที่สแกน
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0];

      // เพิ่มรายการใหม่ไว้บนสุดของ Array
      scannedItems.unshift({ code: code, time: timeStr });
      
      playBeep('success');
      showToast(`✓ เพิ่มแล้ว: ${code}`, 'bg-blue-600 text-white');
      
      barcodeInput.value = '';
      renderList();
      keepFocus();
    }

    // ฟังก์ชันวาดรายการบนหน้าจอใหม่
    function renderList() {
      const total = scannedItems.length;
      itemCount.textContent = total;
      saveBtnText.textContent = `บันทึก (${total})`;

      if (total === 0) {
        emptyState.classList.remove('hidden');
        scannedList.classList.add('hidden');
        scannedList.innerHTML = '';
        return;
      }

      emptyState.classList.add('hidden');
      scannedList.classList.remove('hidden');

      scannedList.innerHTML = scannedItems.map((item, index) => {
        // หมายเลขลำดับจริง (นับจากรายการแรกที่ยิง)
        const orderNumber = total - index;
        return `
          <li class="bg-white px-4 py-4 rounded-2xl border-2 border-slate-200 shadow-sm flex items-center justify-between">
            <div class="flex items-center space-x-4 overflow-hidden">
              <span class="bg-blue-100 text-blue-700 font-extrabold text-2xl w-14 h-14 rounded-xl flex items-center justify-center shrink-0">
                ${orderNumber}
              </span>
              <div class="truncate">
                <p class="font-extrabold text-slate-900 text-3xl leading-tight truncate select-all">${escapeHtml(item.code)}</p>
                <p class="text-xl text-slate-500 leading-tight mt-1">${item.time}</p>
              </div>
            </div>
            <button 
              type="button" 
              onclick="removeItem(${index})" 
              class="text-rose-600 bg-rose-50 hover:bg-rose-100 active:bg-rose-200 p-4 rounded-2xl transition shrink-0 ml-2"
              title="ลบรายการนี้">
              <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
            </button>
          </li>
        `;
      }).join('');
    }

    // ลบรายการเฉพาะแถวที่เลือก
    window.removeItem = function(index) {
      scannedItems.splice(index, 1);
      renderList();
      keepFocus();
    };

    // ป้องกัน XSS เมื่อแสดงข้อความบาร์โค้ด
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // =========================================================================
    // 4. ฟังก์ชันจัดการแถบแจ้งเตือนและการโฟกัสช่องสแกน
    // =========================================================================
    let toastTimer = null;
    function showToast(message, colorClasses) {
      toastBanner.textContent = message;
      toastBanner.className = `px-5 py-3.5 text-2xl font-bold text-center transition-all duration-200 shrink-0 ${colorClasses}`;
      toastBanner.classList.remove('hidden');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastBanner.classList.add('hidden');
      }, 2500);
    }

    function keepFocus() {
      setTimeout(() => {
        barcodeInput.focus();
      }, 50);
    }

    // =========================================================================
    // 5. ฟังก์ชันส่งข้อมูลทั้งหมดขึ้น Google Sheets
    // =========================================================================
    async function saveToGoogleSheets() {
      if (isSaving) return;

      if (scannedItems.length === 0) {
        showToast('⚠️ ยังไม่มีรายการเลขพัสดุให้บันทึก', 'bg-amber-500 text-white');
        keepFocus();
        return;
      }

      isSaving = true;
      saveBtn.disabled = true;
      saveBtn.classList.add('opacity-75', 'cursor-not-allowed');
      saveBtnText.textContent = 'กำลังบันทึก...';
      statusText.textContent = 'กำลังส่งข้อมูลเข้าชีต...';

      // เรียงลำดับจากรายการแรกที่ยิงไปหารายการล่าสุดก่อนส่ง
      const itemsToSend = [...scannedItems].reverse().map(item => item.code);

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8',
          },
          body: JSON.stringify({ items: itemsToSend })
        });

        const result = await response.json();

        if (result.status === 'success') {
          playBeep('saved');
          showToast(`✅ ${result.message}`, 'bg-emerald-600 text-white');
          statusText.textContent = 'บันทึกล่าสุดสำเร็จ';
          scannedItems = [];
          renderList();
        } else {
          throw new Error(result.message || 'ไม่สามารถบันทึกข้อมูลได้');
        }
      } catch (error) {
        console.error('Save error:', error);
        playBeep('duplicate');
        showToast(`❌ บันทึกล้มเหลว: ${error.message}`, 'bg-rose-600 text-white');
        statusText.textContent = 'เกิดข้อผิดพลาดในการส่งข้อมูล';
      } finally {
        isSaving = false;
        saveBtn.disabled = false;
        saveBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        saveBtnText.textContent = `บันทึก (${scannedItems.length})`;
        keepFocus();
      }
    }

    // =========================================================================
    // 6. ผูก Event Listeners (รับค่าอัตโนมัติทั้งแบบมี Enter และไม่มี Enter)
    // =========================================================================
    let autoSubmitTimer = null;

    // กรณีเครื่องสแกนยิงแล้วส่ง Enter (KeyCode 13) มาให้ -> เพิ่มทันที
    barcodeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.keyCode === 13) {
        e.preventDefault();
        clearTimeout(autoSubmitTimer);
        handleBarcodeSubmit(barcodeInput.value);
      }
    });

    // กรณีเครื่องสแกนไม่ได้ตั้งค่า Enter ต่อท้าย -> รอ 120ms หลังข้อความหยุดไหลแล้วเพิ่มให้อัตโนมัติ
    barcodeInput.addEventListener('input', () => {
      clearTimeout(autoSubmitTimer);
      if (barcodeInput.value.trim().length > 0) {
        autoSubmitTimer = setTimeout(() => {
          handleBarcodeSubmit(barcodeInput.value);
        }, 120);
      }
    });

    saveBtn.addEventListener('click', saveToGoogleSheets);

    clearBtn.addEventListener('click', () => {
      if (scannedItems.length === 0) return;
      confirmModal.classList.remove('hidden');
      confirmModal.classList.add('flex');
    });

    cancelClearBtn.addEventListener('click', () => {
      confirmModal.classList.add('hidden');
      confirmModal.classList.remove('flex');
      keepFocus();
    });

    confirmClearBtn.addEventListener('click', () => {
      scannedItems = [];
      renderList();
      confirmModal.classList.add('hidden');
      confirmModal.classList.remove('flex');
      showToast('ล้างรายการทั้งหมดแล้ว', 'bg-slate-700 text-white');
      keepFocus();
    });

    refocusBtn.addEventListener('click', keepFocus);

    // เมื่อเปิดหน้าเว็บครั้งแรก ให้โฟกัสที่ช่องยิงบาร์โค้ดทันที
    window.addEventListener('load', () => {
      keepFocus();
    });
  </script>
</body>
</html>
